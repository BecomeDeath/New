name: Build

# Every push builds, tests and packages the installers for Windows, macOS and Linux, then installs
# each one on its runner and checks the result. Pushing a tag v<version> (matching the version in
# CMakeLists.txt) also publishes a GitHub release with the installers and latest.json, the file
# the plug-in reads to say "An update is available".

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            configure: ""
          - name: macOS
            os: macos-latest
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          - name: Linux
            os: ubuntu-24.04
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release

    env:
      PROMPTMIDI_NO_UPDATE_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libxcomposite-dev libxi-dev libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev libgl1-mesa-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Version
        id: version
        shell: bash
        run: |
          v=$(sed -n 's/^project (PromptMIDI VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "PromptMIDI $v"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version in CMakeLists.txt ($v)."
            exit 1
          fi

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage
        shell: bash
        run: bash Packaging/stage.sh build/PromptMIDI_artefacts/Release build/stage "${{ steps.version.outputs.version }}"

      # --- Windows: Inno Setup installer ---------------------------------------------------------
      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress | Out-Null
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" "/DStage=$PWD\build\stage" "/O$PWD\dist" Packaging\Windows\PromptMIDI.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "$PWD\dist\PromptMIDI-Windows-Setup.exe"
          $hostTest = "$PWD\build\promptmidi_host_test_artefacts\Release\promptmidi_host_test.exe"
          $sounds = "$env:ProgramData\PromptMIDI\Sounds\GeneralUser-GS.sf2"

          function Run($file, $arguments) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$file exited with $($p.ExitCode)" }
          }
          function Expect($path, $present) {
            if ((Test-Path $path) -ne $present) { throw "$path should $(if ($present) {''} else {'not '})exist" }
            Write-Host "ok  $(if ($present) {'present'} else {'absent '})  $path"
          }
          function Uninstall($appDir) {
            Run "$appDir\unins000.exe" '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
            # The uninstaller hands over to a copy of itself; wait for that to finish.
            for ($i = 0; $i -lt 60 -and (Test-Path "$appDir\unins000.exe"); $i++) { Start-Sleep 1 }
          }

          Write-Host "== Everything, standard folders"
          Run $setup '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=install-1.log'
          $vst3 = "$env:CommonProgramFiles\VST3\PromptMIDI.vst3"
          $app = "$env:ProgramFiles\PromptMIDI"
          Expect "$vst3\Contents\x86_64-win\PromptMIDI.vst3" $true
          Expect "$vst3\Contents\Resources\GeneralUser-GS.sf2" $false
          Expect "$app\PromptMIDI.exe" $true
          Expect "$app\ReadMe.txt" $true
          Expect $sounds $true
          & $hostTest $vst3
          if ($LASTEXITCODE -ne 0) { throw "the installed VST3 failed the host test" }
          Uninstall $app
          Expect $vst3 $false
          Expect "$app\PromptMIDI.exe" $false
          Expect $sounds $false

          Write-Host "== Only the VST3, in chosen folders"
          Run $setup '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=install-2.log /COMPONENTS="vst3" /VST3DIR="C:\PromptMIDI test\VST3" /DIR="C:\PromptMIDI test\App"'
          Expect "C:\PromptMIDI test\VST3\PromptMIDI.vst3\Contents\x86_64-win\PromptMIDI.vst3" $true
          Expect "$env:CommonProgramFiles\VST3\PromptMIDI.vst3" $false
          Expect "C:\PromptMIDI test\App\PromptMIDI.exe" $false
          Expect "C:\PromptMIDI test\App\ReadMe.txt" $false
          Expect $sounds $true
          Uninstall "C:\PromptMIDI test\App"
          Expect "C:\PromptMIDI test\VST3\PromptMIDI.vst3" $false

      # --- macOS: .pkg ---------------------------------------------------------------------------
      - name: Build the installer (macOS)
        if: runner.os == 'macOS'
        run: bash Packaging/macOS/make_pkg.sh build/stage "${{ steps.version.outputs.version }}" dist/PromptMIDI-macOS.pkg

      - name: Test the installer (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          expect() { if [ "$1" = yes ]; then test -e "$2"; else test ! -e "$2"; fi; echo "ok  $1  $2"; }
          SUPPORT="/Library/Application Support/PromptMIDI"
          reset() {
            sudo rm -rf /Library/Audio/Plug-Ins/VST3/PromptMIDI.vst3 /Library/Audio/Plug-Ins/Components/PromptMIDI.component \
                        /Applications/PromptMIDI.app "$SUPPORT" /Users/Shared/PromptMIDI-test
            for p in $(pkgutil --pkgs | grep '^com\.promptmidi\.' || true); do sudo pkgutil --forget "$p" > /dev/null; done
          }

          echo "== Everything, standard folders"
          sudo installer -pkg dist/PromptMIDI-macOS.pkg -target /
          expect yes /Library/Audio/Plug-Ins/VST3/PromptMIDI.vst3
          expect yes /Library/Audio/Plug-Ins/Components/PromptMIDI.component
          expect yes /Applications/PromptMIDI.app
          expect yes "$SUPPORT/Sounds/GeneralUser-GS.sf2"
          expect yes "$SUPPORT/ReadMe.txt"
          expect no /Library/Audio/Plug-Ins/VST3/PromptMIDI.vst3/Contents/Resources/GeneralUser-GS.sf2
          codesign --verify --deep --strict /Library/Audio/Plug-Ins/VST3/PromptMIDI.vst3
          codesign --verify --deep --strict /Applications/PromptMIDI.app
          build/promptmidi_host_test_artefacts/Release/promptmidi_host_test /Library/Audio/Plug-Ins/VST3/PromptMIDI.vst3
          reset

          echo "== Only the VST3, in a chosen folder"
          off() { printf '<dict><key>choiceIdentifier</key><string>%s</string><key>choiceAttribute</key><string>selected</string><key>attributeSetting</key><integer>0</integer></dict>' "$1"; }
          {
            echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><array>'
            off au; off app; off readme
            echo '<dict><key>choiceIdentifier</key><string>vst3</string><key>choiceAttribute</key><string>customLocation</string><key>attributeSetting</key><string>/Users/Shared/PromptMIDI-test/VST3</string></dict>'
            echo '</array></plist>'
          } > choices.plist
          sudo installer -pkg dist/PromptMIDI-macOS.pkg -target / -applyChoiceChangesXML choices.plist
          expect yes /Users/Shared/PromptMIDI-test/VST3/PromptMIDI.vst3
          expect no /Library/Audio/Plug-Ins/VST3/PromptMIDI.vst3
          expect no /Library/Audio/Plug-Ins/Components/PromptMIDI.component
          expect no /Applications/PromptMIDI.app
          expect yes "$SUPPORT/Sounds/GeneralUser-GS.sf2"
          reset

      # --- Linux: tarball with install.sh --------------------------------------------------------
      - name: Build the installer (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/PromptMIDI-Linux
          cp -R build/stage/. dist/PromptMIDI-Linux/
          cp Packaging/Linux/install.sh dist/PromptMIDI-Linux/
          cp Packaging/Art/promptmidi-256.png dist/PromptMIDI-Linux/promptmidi.png
          tar -czf dist/PromptMIDI-Linux.tar.gz -C dist PromptMIDI-Linux

      - name: Test the installer (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          expect() { if [ "$1" = yes ]; then test -e "$2"; else test ! -e "$2"; fi; echo "ok  $1  $2"; }
          T="$RUNNER_TEMP/promptmidi"
          mkdir -p "$T" && tar -xzf dist/PromptMIDI-Linux.tar.gz -C "$T"

          echo "== For this user, everything"
          "$T/PromptMIDI-Linux/install.sh" --yes < /dev/null
          expect yes ~/.vst3/PromptMIDI.vst3/Contents/x86_64-linux/PromptMIDI.so
          expect no ~/.vst3/PromptMIDI.vst3/Contents/Resources/GeneralUser-GS.sf2
          expect yes ~/.local/bin/promptmidi
          expect yes ~/.local/share/PromptMIDI/Sounds/GeneralUser-GS.sf2
          expect yes ~/.local/share/applications/promptmidi.desktop
          build/promptmidi_host_test_artefacts/Release/promptmidi_host_test ~/.vst3/PromptMIDI.vst3
          ~/.local/share/PromptMIDI/uninstall.sh
          expect no ~/.vst3/PromptMIDI.vst3
          expect no ~/.local/bin/promptmidi
          expect no ~/.local/share/PromptMIDI

          echo "== For every user, only the VST3, in a chosen folder"
          sudo "$T/PromptMIDI-Linux/install.sh" --yes --no-app --no-readme --vst3-dir /opt/promptmidi-test/vst3 < /dev/null
          expect yes /opt/promptmidi-test/vst3/PromptMIDI.vst3
          expect no /usr/local/bin/promptmidi
          expect yes /usr/local/share/PromptMIDI/Sounds/GeneralUser-GS.sf2
          expect no /usr/local/share/PromptMIDI/ReadMe.txt
          sudo /usr/local/share/PromptMIDI/uninstall.sh
          expect no /opt/promptmidi-test/vst3/PromptMIDI.vst3
          expect no /usr/local/share/PromptMIDI

      - uses: actions/upload-artifact@v4
        with:
          name: PromptMIDI-${{ matrix.name }}
          path: |
            dist/PromptMIDI-Windows-Setup.exe
            dist/PromptMIDI-macOS.pkg
            dist/PromptMIDI-Linux.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes and latest.json
        run: |
          set -euo pipefail
          v=${GITHUB_REF_NAME#v}
          # This version's section of CHANGELOG.md.
          awk -v v="$v" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no '## $v' section."; exit 1; fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          VERSION="$v" BASE="$base" python3 - <<'EOF'
          import json, os, re
          notes = open("notes.md", encoding="utf-8").read()
          lines = [re.sub(r"^[-*]\s*", "", l).strip() for l in notes.splitlines() if l.strip()]
          short = " ".join(lines)
          if len(short) > 300:
              short = short[:297].rsplit(" ", 1)[0] + "..."
          base = os.environ["BASE"]
          manifest = {
              "version": os.environ["VERSION"],
              "notes": short,
              "page": "https://becomedeath.github.io/TLComposer/promptmidi.html#download",
              "downloads": {
                  "windows": f"{base}/PromptMIDI-Windows-Setup.exe",
                  "macos": f"{base}/PromptMIDI-macOS.pkg",
                  "linux": f"{base}/PromptMIDI-Linux.tar.gz",
              },
          }
          json.dump(manifest, open("dist/latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "PromptMIDI ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            dist/PromptMIDI-Windows-Setup.exe dist/PromptMIDI-macOS.pkg dist/PromptMIDI-Linux.tar.gz dist/latest.json
